<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐸 Giant Frog · Eat & Grow</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 50%, #ddd6fe 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 12px;
            overflow: hidden;
        }
        .game-area {
            background: #faf5ff;
            padding: 14px;
            border-radius: 26px;
            box-shadow: 0 14px 36px rgba(107, 33, 168, 0.18), 0 2px 6px rgba(107, 33, 168, 0.08);
            border: 2px solid #e9d5ff;
            max-width: 760px;
            width: 100%;
            position: relative;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
            padding: 0 4px;
            color: #4c1d95;
            font-weight: 800;
            font-size: 1.05rem;
        }
        .stats-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .pill {
            background: #f3e8ff;
            border: 1.5px solid #d8b4fe;
            padding: 5px 14px;
            border-radius: 999px;
            letter-spacing: 0.3px;
            box-shadow: inset 0 -2px 0 #e9d5ff;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .pill span.val {
            color: #7e22ce;
            font-variant-numeric: tabular-nums;
        }
        .restart {
            background: linear-gradient(180deg, #a855f7 0%, #9333ea 100%);
            border: none;
            font-size: 1rem;
            padding: 6px 16px 7px;
            border-radius: 999px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 4px 0 #6b21a8;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.06s ease, box-shadow 0.06s ease;
        }
        .restart:hover {
            background: linear-gradient(180deg, #b366f9 0%, #9f44f0 100%);
        }
        .restart:active {
            box-shadow: 0 1px 0 #6b21a8;
            transform: translateY(3px);
        }
        .canvas-wrapper {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid #d8b4fe;
            box-shadow: 0 6px 18px rgba(88, 28, 135, 0.16);
            background: #ede9fe;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
            touch-action: none;
        }
        .hint {
            text-align: center;
            margin-top: 10px;
            color: #6b21a8;
            font-size: 0.92rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        /* Game Over Modal Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(46, 16, 101, 0.68);
            backdrop-filter: blur(5px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: #ffffff;
            z-index: 10;
        }
        .overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }
        .overlay-card {
            background: #faf5ff;
            color: #3b0764;
            border: 3px solid #c084fc;
            border-radius: 24px;
            padding: 24px 32px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .overlay-card h2 {
            margin: 0 0 8px;
            font-size: 1.75rem;
            color: #7e22ce;
        }
        .overlay-card p {
            margin: 6px 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #581c87;
        }
        .overlay-stats {
            background: #f3e8ff;
            border-radius: 14px;
            padding: 12px;
            margin: 14px 0 18px;
            border: 1.5px solid #e9d5ff;
        }
        .play-again-btn {
            background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 10px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 0 #4c1d95;
            transition: transform 0.06s ease;
        }
        .play-again-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #4c1d95;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="game-area">
    <div class="top-bar">
        <div class="stats-group">
            <div class="pill">🏆 Score: <span class="val" id="scoreDisplay">0</span></div>
            <div class="pill">🐸 Size: <span class="val" id="sizeDisplay">1.00x</span></div>
            <div class="pill">🍽️ Eaten: <span class="val" id="eatenDisplay">0</span></div>
        </div>
        <button class="restart" id="restartButton">↻ Restart</button>
    </div>

    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="720" height="520"></canvas>
        <div class="overlay" id="gameOverOverlay">
            <div class="overlay-card">
                <h2>CRUSHED! 💥</h2>
                <p id="deathReason">Hit a much larger vehicle!</p>
                <div class="overlay-stats">
                    <p>🏆 Final Score: <strong id="finalScore">0</strong></p>
                    <p>🐸 Max Size: <strong id="finalSize">1.00x</strong></p>
                    <p>🍽️ Vehicles Eaten: <strong id="finalEaten">0</strong></p>
                </div>
